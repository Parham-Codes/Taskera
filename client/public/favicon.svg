<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F5AE4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="20" y1="20" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <filter id="shadow" x="0" y="2" width="64" height="64" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#4F5AE4" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Rounded Squircle Base -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#brandGrad)" filter="url(#shadow)"/>
  
  <!-- Inner subtle border -->
  <rect x="5" y="5" width="54" height="54" rx="15" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  
  <!-- Task Checkmark & Spark Path -->
  <path d="M21 33.5L28.5 41L44 23" stroke="url(#checkGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Small Accent Dot -->
  <circle cx="43" cy="18" r="2.5" fill="#60a5fa"/>
</svg>